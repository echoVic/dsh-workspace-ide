# Stage a new package version on npm from a release tag.
#
# Staged publishing (npm 11.15+) uploads the tarball to npm's staging queue
# without requiring 2FA; a maintainer then approves it on npmjs.com (or with
# `npm stage approve <id>`), which is the human proof-of-presence step.
#
# Authentication is trusted publishing (GitHub OIDC): no npm token is stored in
# this repository. The matching trusted-publisher configuration must be created
# on the npm package settings page with "Allow npm stage publish" (not direct
# publish), repository echoVic/dsh-workspace-ide and workflow file publish.yml.
name: Stage npm release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Staged publishing needs npm >= 11.15 (Node 22.14+); trusted publishing
      # needs the id-token permission above.
      - name: Use npm with staged publishing support
        run: npm install --global npm@^11.15.0

      - name: Verify the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          echo "staging dsh-workspace-ide@$VERSION"

      - name: Stage the package on npm
        run: npm stage publish --access public
