# Publish a new package version to npm from a release tag.
#
# Authentication is trusted publishing (GitHub OIDC): no npm token is stored in
# this repository. The matching trusted-publisher configuration on the npm
# package settings page must grant "Allow npm publish" for repository
# echoVic/dsh-workspace-ide and workflow file publish.yml.
name: Publish npm release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Trusted publishing (OIDC) and provenance need a recent npm; the
      # id-token permission above is what lets npm exchange the GitHub OIDC
      # token for registry publish access.
      - name: Use npm with trusted publishing support
        run: npm install --global npm@^11.15.0

      - name: Verify the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG=${GITHUB_REF_NAME#v}
            if [ "$VERSION" != "$TAG" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match package.json version $VERSION"
              exit 1
            fi
          fi
          echo "staging dsh-workspace-ide@$VERSION"

      - name: Publish the package to npm
        run: npm publish --access public
